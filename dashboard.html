<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Issues</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="./style.css">
</head>

<body class="bg-gray-100">

<!-- Navbar -->

<nav class="bg-white shadow-sm border-b">

<div class="max-w-7xl mx-auto flex justify-between items-center p-4">

<div class="flex items-center gap-2 font-semibold">

<img src="https://cdn-icons-png.flaticon.com/512/25/25231.png" class="w-6">
GitHub Issues Tracker

</div>

<div class="flex gap-2">

<input id="searchInput"
placeholder="Search issues..."
class="border rounded px-3 py-1">

<button id="searchBtn" class="bg-purple-600 text-white px-4 rounded">
Search
</button>

</div>

</div>

</nav>

<!-- Tabs Section -->

<div class="max-w-7xl mx-auto mt-6">

<div class="bg-white p-6 rounded-lg shadow">

<!-- Tabs -->

<div class="mb-6 bg-white-900 p-4 shadow-sm border border-gray-200">
    <div class="flex gap-3 mb-4">

<button onclick="loadIssues('all')" id="allBtn"
class="tab bg-purple-600 text-white px-4 py-1 rounded">
All
</button>

<button onclick="loadIssues('open')" id="openBtn"
class="tab border text-gray-600 px-4 py-1 rounded">
Open
</button>

<button onclick="loadIssues('closed')" id="closedBtn"
class="tab border text-gray-600 px-4 py-1 rounded">
Closed
</button>

</div>
</div>

<!-- Issue Count -->

<div class="flex justify-between items-center mb-2 bg-white-900 p-4 border border-gray-200">

   <div class="flex justify-center items-center gap-2">
     <div class="w-10 h-8 flex items-center">
    <img src="./assets/Group 1.png" alt="">
</div>
<div>

<h2 class="font-semibold text-lg">
50 Issues
</h2>
<p class="text-gray-500 text-sm">
Track and manage your project issues
</p>
   </div>



</div>

<div class="flex gap-4 text-sm">

<p class="text-green-600">● <span class="text-black">Open</span></p>
<p class="text-purple-600">● <span  class="text-black">Closed</span></p>

</div>

</div>

<!-- Issue Cards -->

<div id="issuesContainer"
class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">

</div>

</div>

</div>

<script src="script.js"></script>
<!-- Issue Modal -->

<div id="issueModal" class="fixed inset-0 bg-black/40 hidden items-center justify-center">

<div class="bg-white w-[420px] rounded-lg shadow-lg p-6">

<h2 id="modalTitle" class="text-xl font-bold mb-2"></h2>

<div class="flex items-center gap-2 text-sm mb-3">
    <span id="modalStatus" class="px-2 py-0.5 rounded text-white text-xs capitalize"></span>
    
    <span class="text-gray-400">•</span>
    <span class="text-gray-500">Opened by <span id="modalAuthor" class="text-gray-700 font-medium"></span></span>
    
    <span class="text-gray-400">•</span>
    <span id="modalDate" class="text-gray-500"></span>
</div>

<div class="flex gap-2 mb-4">
    <p class="bg-red-50 text-red-600 px-2 py-1 rounded flex items-center gap-1 border border-red-400 rounded-full"><span><img src="./assets/BugDroid.png" alt=""></span><span>BUG</span></p>
            <span class="bg-amber-50 text-amber-600 px-2 py-1 rounded flex items-center gap-1 border border-red-400 rounded-full"><span><img src="./assets/Lifebuoy.png" alt=""></span>HELP WANTED</span>
</div>

<p id="modalDescription" class="text-gray-600 text-sm mb-6"></p>


<div class="flex justify-between text-sm mb-6">
<p>Assignee: <span id="modalAssignee" class="font-medium"></span></p>
<p>Priority: <span id="modalPriority" class="px-2 py-1 rounded text-white text-xs"><button></button></span></p>
</div>

<div class="text-right">
<button onclick="closeModal()" class="bg-purple-600 text-white px-4 py-1 rounded">
Close
</button>
</div>

</div>

</div>

</body>
